<!DOCTYPE html>
<html>

<!-- HELLO! I MADE THIS! I'm Trevor, I made all of this! -->

<head>
    <title>Red Black Tree Visualization</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSSFiles/RedBlackTree.css">
    <link rel="icon" type="image/x-icon" href="Images\dinosaur approved.png">
</head>

<body class="bg-gray-900 items-center h-screen w-screen" onload="settingUp()">
    <div class="h-full w-full  grid grid-cols-1 grid-rows-7 z-50  p-4 gap-2">
        <div
            class="w-full z-50 p-1 rounded-xl bg-gray-950 border-4 border-gray-600 text-white font-bold text-2xl grid grid-cols-6 grid-rows-1 gap-2">
            <div class="w-full text-center place-content-center text-lg">
                Please type in your numerical input:
            </div>
            <input type="text" name="Team name" id="input" class="col-span-2 rounded-sm border-4 border-cyan-400 bg-black
                    text-white p-2">
            <button onclick="insertButton()"
                class="w-full holder1 holder2 place-content-center bg-red-800 rounded-xl hover:bg-red-400 transition duration-300">
                insert
            </button>
            <button onclick="enableRemoval()"
                class="w-full immunity place-content-center bg-red-800 rounded-xl hover:bg-red-400 transition duration-300">
                remove selected
            </button>
            <button onclick="clearTree()"
                class="w-full holder1 holder2 place-content-center bg-red-800 rounded-xl hover:bg-red-400 transition duration-300">
                clear tree
            </button>
        </div>

        <div class="w-full h-full border-gray-700 rounded-xl row-span-6 border-4 p-1 overflow-scroll"
            id="scrollContainer">
            <div class="w-full h-full grid grid-cols-2 gap-2 justify-center" id="treeContain" deleting="false">
                <div class="col-span-2 z-50 justify-center items-center flex" id="1">
                </div>
            </div>
            <div class="h-full w-full absolute z-10 inset-0 overflow-hidden pointer-events-none" id="theLineHolder">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="NodeMovement/nodeColouring.js">
    </script>
    <script src="RedBlackTreeJSCode/standardUpholder.js">
    </script>
    <script src="RedBlackTreeJSCode/nodeDataGetter.js">
    </script>
    <script src="UserInterfaceScripts/widthChanger.js">
    </script>
    <script src="NodeMovement/treeMovers.js">
    </script>
    <script src="UserInterfaceScripts/nodeDrawing.js">
    </script>
    <script src="NodeMovement/nodeMovement.js">
    </script>
    <script src="RedBlackTreeJSCode/RedBlackTreeInsertion.js">
    </script>
    <script src="NodeMovement/nodeInsertion.js">
    </script>
    <script src="RedBlackTreeJSCode/RedBlackTreeDeletion.js">
    </script>
    <script src="UserInterfaceScripts/removalMode.js">
    </script>
    <script src="UserInterfaceScripts/codeForButtons.js">
    </script>
    <script src="UserInterfaceScripts/onLoadFunction.js">
    </script>
</body>

</html>
